# ==============================================================================
# 默认服务器 — 拦截所有未匹配 server_name 的请求
# 配合 conf.d/*.conf 中具体站点使用，自身只做黑洞处理
# ==============================================================================

# HTTP 黑洞
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    access_log off;
    error_log /var/log/nginx/error.log crit;

    limit_conn conn_limit 5;

    keepalive_timeout 0;
    reset_timedout_connection on;

    return 444;
}

# HTTPS 黑洞
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;

    server_name _;

    ssl_reject_handshake on;

    access_log off;
    error_log /var/log/nginx/error.log crit;

    keepalive_timeout 0;
    reset_timedout_connection on;
}
